spring.application.name=finplus

# URL de conexão
#spring.datasource.url=jdbc:postgresql://${PGSSQL_URL_LOCAL}
spring.datasource.url=jdbc:postgresql://${PGSQL_HOST_SU}:${PGSQL_PORT}/${PGSQL_DATABASE_SU}?sslmode=require

# Usuário
spring.datasource.username=${PGSQL_USERNAME}

# Senha
spring.datasource.password=${PGSQL_PASSWORD_SU}

# portaDocker e ren
server.port=${PORT:8080}

# Driver do PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do Hibernate / JPA
# O dialeto ajuda o Hibernate a falar a "língua" específica do Postgres
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ddl-auto=validate fará o Flyway trabalhar sem editar automaticamente
# ou altera se você adicionar novas colunas (mas não deleta dados existentes).
spring.jpa.hibernate.ddl-auto=validate

# Mostra o SQL gerado pelo Spring no console (ótimo para testar)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#diz ?se o schema não estiver vazio, crie o histórico e siga em frente?.
spring.flyway.baseline-on-migrate=true
#o Flyway marca a versão 1 como já aplicada e pula a sua migração V1__.... As tabelas nunca seriam criadas
spring.flyway.baseline-version=0

# spring.flyway.baseline-on-migrate=true

# spring.flyway.enabled=false

# chave do jwt-token
jwt.secret=${JWT_SECRET}