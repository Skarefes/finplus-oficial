spring.application.name=finplus

# URL de conexao
spring.datasource.url=jdbc:postgresql://${PGSQL_HOST_SU}:${PGSQL_PORT}/${PGSQL_DATABASE_SU}?sslmode=require
#spring.datasource.url=jdbc:postgresql://${PGSSQL_URL_LOCAL}
# Usuario
spring.datasource.username=${PGSQL_USERNAME}

# Senha
spring.datasource.password=${PGSQL_PASSWORD_SU}


# Porta (o Render injeta PORT; local usa 8080)
server.port=${PORT:8080}

# Driver do PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool menor para o plano free
spring.datasource.hikari.maximum-pool-size=5

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Chave do JWT
jwt.secret=${JWT_SECRET}