<div [class.container]="auth.logado()">
  @if (auth.logado()) {
    <header class="topo">
      <a class="marca" routerLink="/" aria-label="FinPlus, ir para o painel">
        <span class="marca-icone" aria-hidden="true">F</span>
        <span class="marca-nome">FinPlus</span>
      </a>

      <nav class="navegacao" aria-label="Navegação principal">
        <a routerLink="/" routerLinkActive="ativo" [routerLinkActiveOptions]="{ exact: true }">
          Visão geral
        </a>
        <a routerLink="/configuracoes" routerLinkActive="ativo">Configurações</a>
      </nav>

      <div class="usuario">
        <button type="button" class="botao-sair" (click)="auth.logout()">Sair</button>
      </div>
    </header>
  }

<router-outlet />

  @if (auth.logado()) {
    <footer>
      <p>FinPlus · Controle financeiro simplificado</p>
    </footer>
  }
</div>
